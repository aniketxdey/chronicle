[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chronicle-mcp"
version = "0.1.0"
description = "Record your screen and system events for a set time, build a knowledge graph, and serve it to any agent over MCP."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
]
keywords = ["mcp", "model-context-protocol", "computer-use", "knowledge-graph", "screen-recording", "agents"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
keyphrases = ["scikit-learn>=1.3"]

[project.scripts]
chronicle = "chronicle.cli:main"

[tool.setuptools]
packages = ["chronicle"]

[tool.setuptools.package-data]
chronicle = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
