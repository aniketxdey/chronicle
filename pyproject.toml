[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chronicle-context"
version = "0.2.0"
description = "Record your screen and system events for a set time, build a knowledge graph, and serve it to any agent over MCP."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Aniket Dey" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
]
keywords = ["mcp", "model-context-protocol", "computer-use", "knowledge-graph", "screen-recording", "agents"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/aniketxdey/chronicle"
Repository = "https://github.com/aniketxdey/chronicle"
Issues = "https://github.com/aniketxdey/chronicle/issues"
Documentation = "https://github.com/aniketxdey/chronicle#readme"
Privacy = "https://github.com/aniketxdey/chronicle/blob/main/PRIVACY.md"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "build>=1.2"]
graph = ["scikit-learn>=1.3", "scipy>=1.10", "numpy>=1.24"]

[project.scripts]
chronicle = "chronicle.cli:main"
# `uvx chronicle-context mcp` runs the script named after the package.
chronicle-context = "chronicle.cli:main"

[tool.setuptools]
packages = ["chronicle"]

[tool.setuptools.package-data]
chronicle = ["web/*", "helpers/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
